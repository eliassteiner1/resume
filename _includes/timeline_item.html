<div class="timeline-item{% if include.sub %} subitem{% endif %}">
    <div class="timeline-date">{{ include.item.date }}</div>
    <div class="timeline-title">{{ include.item.title }}</div>
    <div class="timeline-location">{{ include.item.location }}</div>
    <div class="timeline-desc">{{ include.item.desc }}</div>
</div>
