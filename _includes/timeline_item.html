<div class="timeline-item{% if include.sub %} subitem{% endif %}">
    <div class="timeline-date">
        <span>{{ include.item.date_start }}</span>
        <span>-</span>
        <span>{{ include.item.date_end }}</span>
    </div>
    <div class="timeline-title">{{ include.item.title }}</div>
    <div class="timeline-location">{{ include.item.location }}</div>
    <div class="timeline-desc">
        {% for point in include.item.desc %}
            <div>{{ point }}</div>
        {% endfor %}
    </div>
</div>
