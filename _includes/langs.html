<!-- main content -->
{% capture content %}
    {% for item in site.data.dat_langs %}
        <div class="langs-item">
            <div class="langs-name">{{ item.name }}</div>
            <div class="langs-level">{{ item.level }}</div>
            <div class="langs-desc">{{ item.desc }}</div>
        </div>
    {% endfor %}
{% endcapture %}


<!-- wrap everything in a basecontainer -->
{% 
    include basecontainer.html
    title=site.data.dat_main.title_langs
    extraclass="langs"
    content=content
%}
