<!-- main content -->
{% capture content %}
    {% for item in site.data.dat_extracurr %}
        <div class="extracurr-item">{{ item.name }}</div>

        {% for subitem in item.subitems %}
            <div class="extracurr-subitem">{{ subitem }}</div>
        {% endfor %}
        
    {% endfor %}
{% endcapture %}


<!-- wrap everything in a basecontainer -->
{% 
    include basecontainer.html
    title=site.data.dat_main.title_extracurr
    extraclass="extracurr"
    content=content
%}
