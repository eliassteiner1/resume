<!-- main content -->
{% capture content %}
    {% for item in site.data.dat_skills %}
    
        <div class="skills-category">{{ item.name }}</div>
        {% for subitem in item.subitems %}
            <div class="skills-subitem">{{ subitem }}</div>
        {% endfor %}

    {% endfor %}
{% endcapture %}


<!-- wrap everything in a basecontainer -->
{% 
    include basecontainer.html
    title=site.data.dat_main.title_skills
    extraclass="skills"
    content=content
%}
